<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>BurnClaw</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <!-- Una sola ventana. #shell se morfea entre pill y widget: cambia
         tamaño + border-radius con transición CSS; los dos contenidos
         hacen crossfade. La ventana del SO nunca se redimensiona. -->
    <div id="shell" class="shell collapsed">
      <!-- ----- contenido PILL ----- -->
      <div class="pill-content" id="pill-content">
        <span
          class="status-dot"
          id="pill-dot"
          data-tooltip="Loading..."
          data-tooltip-pos="below"
        ></span>
        <!-- Un grupo de rings por proveedor activo, generado en main.ts. -->
        <div class="pill-providers" id="pill-providers"></div>
      </div>

      <!-- ----- contenido WIDGET ----- -->
      <div class="widget-content" id="widget-content">
        <header class="header">
          <div class="header-left">
            <img id="mascot" src="/mascot.png" alt="" />
            <span class="product-name">BurnClaw</span>
          </div>
          <div class="header-right">
            <div
              class="status-indicator"
              id="status-indicator"
              data-tooltip="Loading…"
              data-tooltip-pos="below"
            >
              <span class="status-dot" id="status-dot"></span>
              <span id="status-text">—</span>
            </div>
            <button
              class="close-btn"
              id="btn-close"
              data-tooltip="Collapse to pill"
              data-tooltip-pos="below"
              data-tooltip-align="end"
              aria-label="Collapse"
            >
              <svg viewBox="0 0 16 16" width="14" height="14">
                <path
                  d="M4 4L12 12 M12 4L4 12"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                />
              </svg>
            </button>
          </div>
        </header>

        <hr class="sep" />

        <div class="console-banner" id="console-banner" style="display: none">
          <span class="banner-text"></span>
        </div>

        <!-- Un bloque por proveedor activo (cabecera + Session 5h + Weekly 7d),
             generado en main.ts. -->
        <div class="providers" id="providers"></div>

        <footer class="footer">
          <div class="footer-left">
            <button
              class="refresh-btn"
              id="btn-refresh"
              data-tooltip="Refresh now"
              aria-label="Refresh now"
            >
              <svg viewBox="0 0 24 24" fill="none" width="11" height="11">
                <path
                  d="M3 12C3 16.9706 7.02944 21 12 21C14.3051 21 16.4077 20.1334 18 18.7083L21 16M21 12C21 7.02944 16.9706 3 12 3C9.69494 3 7.59227 3.86656 6 5.29168L3 8M21 21V16M21 16H16M3 3V8M3 8H8"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
            <span id="updated-ago">—</span>
          </div>
        </footer>
      </div>
    </div>

    <!-- Panel de actividad: se desliza bajo la pill (estado colapsado) al
         recibir eventos de Claude/Codex. Color por proveedor. -->
    <div id="pill-notif" class="pill-notif">
      <span class="pill-notif-icon"></span>
      <span class="pill-notif-text"></span>
      <button class="pill-notif-close" id="pill-notif-close" aria-label="Dismiss">
        <svg viewBox="0 0 16 16" width="11" height="11">
          <path
            d="M4 4L12 12 M12 4L4 12"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
          />
        </svg>
      </button>
    </div>
  </body>
</html>
